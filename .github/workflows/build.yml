name: Build

on:
  push:
    branches:
      - main
      - sp3-reader
    tags:
      - 'v*'

jobs:
  build-windows:
    if: |
      contains(github.event.head_commit.message, '[Build]') ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build all Python scripts
        shell: pwsh
        run: |
          Get-ChildItem *.py | ForEach-Object {
            Write-Host "Building $($_.Name)"
            pyinstaller --onefile $_.Name
          }

      - name: Stage
        shell: bash
        run: |
          mkdir -p bin/windows
          for script in *.py; do
            base=$(basename "$script" .py)
            cp "dist/${base}.exe" "bin/windows/${base}.exe"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: bin/windows/*

  build-ubuntu:
    if: |
      contains(github.event.head_commit.message, '[Build]') ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build all Python scripts
        run: |
          for script in *.py; do
            echo "Building $script"
            pyinstaller --onefile "$script"
          done

      - name: Stage
        run: |
          mkdir -p bin/linux/ubuntu
          for script in *.py; do
            base=$(basename "$script" .py)
            cp "dist/${base}" "bin/linux/ubuntu/${base}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux-ubuntu
          path: bin/linux/ubuntu/*

  build-debian:
    if: |
      contains(github.event.head_commit.message, '[Build]') ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container: debian:bookworm-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install Python and build tools
        run: |
          apt-get update
          apt-get install -y python3 python3-pip python3-venv binutils

      - name: Install PyInstaller
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pyinstaller

      - name: Build all Python scripts
        run: |
          for script in *.py; do
            echo "Building $script"
            .venv/bin/pyinstaller --onefile "$script"
          done

      - name: Stage
        run: |
          mkdir -p bin/linux/debian
          for script in *.py; do
            base=$(basename "$script" .py)
            cp "dist/${base}" "bin/linux/debian/${base}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux-debian
          path: bin/linux/debian/*

  commit-binaries:
    needs: [build-windows, build-ubuntu, build-debian]
    if: contains(github.event.head_commit.message, '[Build]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Arrange binaries
        run: |
          mkdir -p bin/windows bin/linux/ubuntu bin/linux/debian
          cp artifacts/build-windows/*       bin/windows/
          cp artifacts/build-linux-ubuntu/*  bin/linux/ubuntu/
          cp artifacts/build-linux-debian/*  bin/linux/debian/

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bin/
          git diff --cached --quiet || git commit -m "chore: update binaries [skip ci]"
          git push

  release:
    needs: [build-windows, build-ubuntu, build-debian]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/build-windows/* \
            artifacts/build-linux-ubuntu/* \
            artifacts/build-linux-debian/*
